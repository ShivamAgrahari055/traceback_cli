[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceback-cli"
version = "0.1.0"
description = "Local-first runtime error reconstruction and intelligent debugging CLI/TUI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9,<0.13",
    "click>=8.0,<8.2",
    "rich>=13.0,<14.0",
    "textual>=0.60,<1.0",
    "pydantic>=2.0,<3.0",
    "pytest>=8.0",
]

[project.scripts]
traceback = "tb_core.cli.commands:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = '8.0'
addopts = '--verbose --tb=short'
testpaths = ['tests']
python_files = ['test_*.py']
python_classes = ['Test*']
